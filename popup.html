<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dblp BibTeX cleaner</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 660px; margin: 0; padding: 16px; font: system-ui, sans-serif; }
    h1 { margin-bottom: 12px; font-size: 16px; }
    textarea {
      width: 100%; height: 350px; padding: 12px;
      font: 12px/1.55 ui-monospace, monospace;
      resize: none;
    }
    footer { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    button { padding: 8px 16px; font: inherit; }
    button:disabled { cursor: default; }
    #status { margin: 0; overflow-wrap: anywhere; }
    #status[data-error="true"] { opacity: 1; font-weight: 600; }
    #booktitles { margin-top: 12px; max-height: 120px; overflow-y: auto; }
    #booktitles fieldset { min-width: 0; margin: 0 0 8px; padding: 0; border: 0; }
    #booktitles legend { margin-bottom: 6px; }
    .booktitle-parts { display: flex; flex-wrap: wrap; gap: 6px; }
    .booktitle-part { padding: 3px 6px; font-size: 10px; }
    .booktitle-part[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
  </style>
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>dblp BibTeX cleaner</h1>
  <textarea id="bibtex" aria-label="Editable BibTeX" aria-describedby="status"
    spellcheck="false" autocapitalize="off" autocomplete="off" wrap="soft" disabled></textarea>
  <section id="booktitles" aria-label="Booktitle parts to include" hidden></section>
  <footer>
    <button id="copy" type="button" disabled>Copy to clipboard</button>
    <p id="status" role="status" aria-live="polite">Reading BibTeX…</p>
  </footer>
</body>
</html>
